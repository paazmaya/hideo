[package]
name = "hideo"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A standalone Rust CLI for building PDF books from Markdown"
license = "MIT"
repository = "https://github.com/paazmaya/hideo"
readme = "README.md"
authors = ["Juga Paazmaya <paazmaya@yahoo.com>"]

[features]
default = []
native-diagrams = ["dep:mermaid-rs-renderer"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.2"
serde_json = "1"
pulldown-cmark = { version = "0.13.6", default-features = false }
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["embedded-fonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
camino = "1.2"
percent-encoding = "2.3"
walkdir = "2.5"
alphanumeric-sort = "1.5"
rayon = "1.12"
blake3 = "1.8"
thiserror = "2"
tempfile = "3.27"
wait-timeout = "0.2"
mermaid-rs-renderer = { version = "0.3.1", optional = true, default-features = false }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
insta = "1.49"
proptest = "1.12"
lopdf = { version = "0.47", default-features = false, features = ["rayon"] }
typst-render = "=0.15.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true # link-time optimisation, https://llvm.org/docs/LinkTimeOptimization.html
codegen-units = 1 # single codegen unit
opt-level = 3 # maximum optimisation
strip = true # strip debug symbols
