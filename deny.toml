# cargo-deny configuration (optional): `cargo deny check licenses advisories`.
# The allow-list is the set of licenses found in `cargo metadata --all-features` on 2026-11-18;
# all of them are permissive. Not run in CI yet.

[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "0BSD",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[advisories]
unmaintained = "workspace"
