# https://docs.semaphore.io/reference/pipeline-yaml
version: v1.0
name: hideo-release
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

global_job_config:
  env_vars:
    - name: CARGO_TERM_COLOR
      value: always
    - name: CARGO_INCREMENTAL
      value: "0"
  prologue:
    commands:
      - checkout
      - 'command -v rustup >/dev/null || curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal'
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup show
      - rustc -V && cargo -V

blocks:
  - name: Build Linux x86_64
    task:
      jobs:
        - name: build and archive
          commands:
            - cargo build --release --locked
            - mkdir -p release
            - cp target/release/hideo release/
            - cp LICENSE README.md release/
            - cd release && tar czf ../hideo-${SEMAPHORE_GIT_TAG}-x86_64-unknown-linux-gnu.tar.gz hideo LICENSE README.md
            - sha256sum hideo-${SEMAPHORE_GIT_TAG}-x86_64-unknown-linux-gnu.tar.gz > hideo-${SEMAPHORE_GIT_TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256
            - artifact push workflow hideo-${SEMAPHORE_GIT_TAG}-x86_64-unknown-linux-gnu.tar.gz
            - artifact push workflow hideo-${SEMAPHORE_GIT_TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256

  - name: Build Linux ARM64
    task:
      agent:
        machine:
          type: r1-standard-2
          os_image: ubuntu2404
      jobs:
        - name: build and archive
          commands:
            - cargo build --release --locked
            - mkdir -p release
            - cp target/release/hideo release/
            - cp LICENSE README.md release/
            - cd release && tar czf ../hideo-${SEMAPHORE_GIT_TAG}-aarch64-unknown-linux-gnu.tar.gz hideo LICENSE README.md
            - sha256sum hideo-${SEMAPHORE_GIT_TAG}-aarch64-unknown-linux-gnu.tar.gz > hideo-${SEMAPHORE_GIT_TAG}-aarch64-unknown-linux-gnu.tar.gz.sha256
            - artifact push workflow hideo-${SEMAPHORE_GIT_TAG}-aarch64-unknown-linux-gnu.tar.gz
            - artifact push workflow hideo-${SEMAPHORE_GIT_TAG}-aarch64-unknown-linux-gnu.tar.gz.sha256

  - name: Build macOS ARM64
    task:
      agent:
        machine:
          type: a2-standard-4
          os_image: macos-xcode26
      jobs:
        - name: build and archive
          commands:
            - cargo build --release --locked
            - mkdir -p release
            - cp target/release/hideo release/
            - cp LICENSE README.md release/
            - cd release && tar czf ../hideo-${SEMAPHORE_GIT_TAG}-aarch64-apple-darwin.tar.gz hideo LICENSE README.md
            - sha256sum hideo-${SEMAPHORE_GIT_TAG}-aarch64-apple-darwin.tar.gz > hideo-${SEMAPHORE_GIT_TAG}-aarch64-apple-darwin.tar.gz.sha256
            - artifact push workflow hideo-${SEMAPHORE_GIT_TAG}-aarch64-apple-darwin.tar.gz
            - artifact push workflow hideo-${SEMAPHORE_GIT_TAG}-aarch64-apple-darwin.tar.gz.sha256

  - name: Build macOS x86_64
    task:
      agent:
        machine:
          type: a2-standard-4
          os_image: macos-xcode26
      jobs:
        - name: build and archive
          commands:
            - rustup target add x86_64-apple-darwin
            - cargo build --release --locked --target x86_64-apple-darwin
            - mkdir -p release
            - cp target/x86_64-apple-darwin/release/hideo release/
            - cp LICENSE README.md release/
            - cd release && tar czf ../hideo-${SEMAPHORE_GIT_TAG}-x86_64-apple-darwin.tar.gz hideo LICENSE README.md
            - sha256sum hideo-${SEMAPHORE_GIT_TAG}-x86_64-apple-darwin.tar.gz > hideo-${SEMAPHORE_GIT_TAG}-x86_64-apple-darwin.tar.gz.sha256
            - artifact push workflow hideo-${SEMAPHORE_GIT_TAG}-x86_64-apple-darwin.tar.gz
            - artifact push workflow hideo-${SEMAPHORE_GIT_TAG}-x86_64-apple-darwin.tar.gz.sha256

  - name: Create GitHub Release
    task:
      secrets:
        - name: GH_TOKEN
      jobs:
        - name: create draft release
          commands:
            - gh release view "${SEMAPHORE_GIT_TAG}" || gh release create "${SEMAPHORE_GIT_TAG}" --draft --title "${SEMAPHORE_GIT_TAG}" --notes "Release ${SEMAPHORE_GIT_TAG}"
            - gh release upload "${SEMAPHORE_GIT_TAG}" hideo-*-${SEMAPHORE_GIT_TAG}-*.tar.gz hideo-*-${SEMAPHORE_GIT_TAG}-*.tar.gz.sha256
