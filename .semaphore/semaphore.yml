# https://docs.semaphore.io/reference/pipeline-yaml
version: v1.0
name: hideo
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

auto_cancel:
  running:
    when: "branch != 'main'"

fail_fast:
  stop:
    when: "branch != 'main'"

global_job_config:
  env_vars:
    - name: CARGO_TERM_COLOR
      value: always
    - name: CARGO_INCREMENTAL
      value: "0"
  prologue:
    commands:
      - checkout
      - 'command -v rustup >/dev/null || curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal'
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup show
      - rustc -V && cargo -V
      - cache restore cargo-registry-$(checksum Cargo.lock),cargo-registry
      - cargo fetch --locked
  epilogue:
    on_pass:
      commands:
        - cache has_key cargo-registry-$(checksum Cargo.lock) || cache store cargo-registry-$(checksum Cargo.lock) ~/.cargo/registry

blocks:
  - name: Lint
    run:
      when: "change_in(['/src/', '/tests/', '/assets/', '/Cargo.toml', '/Cargo.lock', '/rust-toolchain.toml', '/.semaphore/'], {default_branch: 'main'})"
    task:
      jobs:
        - name: fmt and clippy
          commands:
            - cargo fmt --all --check
            - cargo clippy --all-targets --locked -- -D warnings

  - name: Dependencies (licenses and advisories)
    run:
      when: "change_in(['/Cargo.toml', '/Cargo.lock', '/deny.toml', '/.semaphore/'], {default_branch: 'main'})"
    task:
      jobs:
        - name: cargo deny
          commands:
            # cargo-binstall downloads a prebuilt cargo-deny instead of compiling it.
            - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
            - cargo binstall --no-confirm --locked cargo-deny
            - cargo deny check

  - name: Test (Linux x86_64)
    run:
      when: "change_in(['/src/', '/tests/', '/assets/', '/Cargo.toml', '/Cargo.lock', '/rust-toolchain.toml', '/.semaphore/'], {default_branch: 'main'})"
    task:
      prologue:
        commands:
          - cache restore target-linux-$(checksum Cargo.lock),target-linux
      jobs:
        - name: cargo test
          commands:
            - cargo test --locked
      epilogue:
        on_pass:
          commands:
            - cache has_key target-linux-$(checksum Cargo.lock) || cache store target-linux-$(checksum Cargo.lock) target

  - name: MSRV (Rust 1.92)
    run:
      when: "change_in(['/src/', '/Cargo.toml', '/Cargo.lock', '/.semaphore/'], {default_branch: 'main'})"
    task:
      jobs:
        - name: cargo check on MSRV
          commands:
            - rustup toolchain install 1.92 --profile minimal
            - cargo +1.92 check --locked

  - name: Test (Linux ARM)
    run:
      when: "change_in(['/src/', '/tests/', '/assets/', '/Cargo.toml', '/Cargo.lock', '/rust-toolchain.toml', '/.semaphore/'], {default_branch: 'main'})"
    task:
      agent:
        machine:
          type: r1-standard-2
          os_image: ubuntu2404
      jobs:
        - name: cargo test
          commands:
            - cargo test --locked

  - name: Test (macOS)
    run:
      when: "change_in(['/src/', '/tests/', '/assets/', '/Cargo.toml', '/Cargo.lock', '/rust-toolchain.toml', '/.semaphore/'], {default_branch: 'main'})"
    task:
      agent:
        machine:
          type: a2-standard-4
          os_image: macos-xcode26
      jobs:
        - name: cargo test
          commands:
            - cargo test --locked

  - name: Release build and end-to-end
    run:
      when: "change_in(['/src/', '/tests/', '/assets/', '/Cargo.toml', '/Cargo.lock', '/rust-toolchain.toml', '/.semaphore/'], {default_branch: 'main'})"
    task:
      jobs:
        - name: build, build fixture twice, compare
          commands:
            - cargo build --release --locked
            - export SOURCE_DATE_EPOCH=1700000000
            - ./target/release/hideo build --input tests/fixtures/full --output out1 --jobs 1
            - ./target/release/hideo build --input tests/fixtures/full --output out2 --jobs 4
            - for f in out1/*.pdf; do cmp "$f" "out2/$(basename "$f")"; done
            - artifact push workflow target/release/hideo
            - artifact push workflow out1 --destination fixture-pdfs

promotions:
  - name: Release
    pipeline_file: release.yml
    auto_promote:
      when: "tag =~ '^v[0-9]+\\.[0-9]+\\.[0-9]+$' AND result = 'passed'"
