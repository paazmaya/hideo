# https://docs.semaphore.io/reference/pipeline-yaml
#
# Machine types: the organization is on the open source plan, which offers the e1 Linux machines
# (https://docs.semaphore.io/reference/machine-types lists f1 as current, but f1 is refused here).
# Minutes are saved by doing the Linux work in one job that shares one `target` cache, and by
# running the expensive macOS job only on `main` and on tags.
version: v1.0
name: hideo
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404

auto_cancel:
  running:
    when: "branch != 'main'"
  queued:
    when: "branch != 'main'"

fail_fast:
  stop:
    when: "branch != 'main'"

global_job_config:
  env_vars:
    - name: CARGO_TERM_COLOR
      value: always
    - name: CARGO_INCREMENTAL
      value: "0"
    # No debug info: the debug `target` is 2 GB instead of 4.9 GB, which matters for the cache,
    # the 25 GB disk and the 4 GB of memory of an e1-standard-2. Compile time is the same.
    - name: CARGO_PROFILE_DEV_DEBUG
      value: "0"
  prologue:
    commands:
      - checkout
      - 'command -v rustup >/dev/null || curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal'
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup show
      - rustc -V && cargo -V
      - cargo fetch --locked
      
blocks:
  # fmt, clippy, tests and the reproducibility check share one machine and one `target` directory,
  # so Typst is compiled once. The binary for the reproducibility check is the one `cargo test`
  # builds; the release profile is built by the release pipeline for tags.
  - name: Linux x86_64 (lint, test, reproducibility)
    run:
      when: "change_in(['/src/', '/tests/', '/assets/', '/.config/', '/Cargo.toml', '/Cargo.lock', '/rust-toolchain.toml', '/.semaphore/'], {default_branch: 'main'})"
    task:
      prologue:
        commands:
          - cache restore cargo-registry-linux-$(checksum Cargo.lock),cargo-registry-linux
          - cargo fetch --locked
          - cache restore target-linux-$(checksum Cargo.lock),target-linux

      jobs:
        - name: fmt, clippy, test, build
          commands:
            # cargo-binstall downloads the test tools instead of compiling them.
            - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
            - cargo binstall --no-confirm --locked cargo-deny cargo-nextest cargo-llvm-cov
            - cargo deny check
            - cargo fmt --all --check
            - cargo clippy --all-targets --locked -- -D warnings
            - cargo nextest run --profile ci --locked
            - export SOURCE_DATE_EPOCH=1700000000
            - ./target/debug/hideo build --input tests/fixtures/full --output out1 --jobs 1
            - ./target/debug/hideo build --input tests/fixtures/full --output out2 --jobs 4
            - for f in out1/*.pdf; do cmp "$f" "out2/$(basename "$f")"; done
            - artifact push workflow out1 --destination fixture-pdfs
            - unset SOURCE_DATE_EPOCH
            - cargo test --locked --no-default-features
            - rustup toolchain install 1.92.0 --profile minimal
            - CARGO_TARGET_DIR="$PWD/target-msrv" cargo +1.92.0 check --lib --locked
            - rustup toolchain install nightly-2026-11-21 --profile minimal --component llvm-tools-preview
            - export CARGO_TARGET_DIR="$PWD/target-unit-coverage"
            - cargo +nightly-2026-11-21 llvm-cov --lib --locked --cobertura --output-path unit-coverage.xml
            - cargo +nightly-2026-11-21 llvm-cov report --show-missing-lines
            - artifact push workflow unit-coverage.xml
      epilogue:
        always:
          commands:
            - test-results publish target/nextest/ci/junit.xml
        on_pass:
          commands:
            - cache has_key cargo-registry-linux-$(checksum Cargo.lock) || (cache delete cargo-registry-linux || true; cache store cargo-registry-linux-$(checksum Cargo.lock),cargo-registry-linux ~/.cargo/registry)
            - cache has_key target-linux-$(checksum Cargo.lock) || (cache delete target-linux || true; cache store target-linux-$(checksum Cargo.lock),target-linux target)

  # The block below only run on `main` and on tags: macOS minutes cost twelve times a Linux
  # minute, and Linux x86_64 already covers every branch.
  - name: Test (macOS)
    run:
      when: "(branch = 'main' OR tag =~ '.*') AND change_in(['/src/', '/tests/', '/assets/', '/.config/', '/Cargo.toml', '/Cargo.lock', '/rust-toolchain.toml', '/.semaphore/'], {default_branch: 'main'})"
    task:
      agent:
        machine:
          type: a2-standard-4
          os_image: macos-xcode26
      prologue:
        commands:
          - cache restore cargo-registry-macos-$(checksum Cargo.lock),cargo-registry-macos
          - cargo fetch --locked
          - cache restore target-macos-$(checksum Cargo.lock),target-macos
      jobs:
        - name: cargo test
          commands:
            - cargo test --locked
      epilogue:
        on_pass:
          commands:
            - cache has_key cargo-registry-macos-$(checksum Cargo.lock) || (cache delete cargo-registry-macos || true; cache store cargo-registry-macos-$(checksum Cargo.lock),cargo-registry-macos ~/.cargo/registry)
            - cache has_key target-macos-$(checksum Cargo.lock) || (cache delete target-macos || true; cache store target-macos-$(checksum Cargo.lock),target-macos target)

promotions:
  - name: Release
    pipeline_file: release.yml
    auto_promote:
      when: "tag =~ '^v[0-9]+\\.[0-9]+\\.[0-9]+$' AND result = 'passed'"
